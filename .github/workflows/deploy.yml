name: Deploy Arcade

# Publishes the arcade-preview/ folder of stratoshivibes-mahjong
# as the site root of arcade.stratoshivibes.com.
# Runs on every push here, every 3 hours, and manually:
# Actions -> Deploy Arcade -> Run workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: stratanen/stratoshivibes-mahjong
          path: src

      - name: Prepare site from arcade-preview/
        run: |
          cp -r src/arcade-preview site
          rm -f site/README.md
          touch site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

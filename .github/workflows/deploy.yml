name: Deploy Arcade

# arcade.stratoshivibes.com is a short link only. The site/ folder holds a page
# that forwards every visit to https://stratanen.github.io/stratoshivibes-mahjong/
# (same path, query and hash), so the games stay on one address and players keep
# their saved progress and Shop purchases.
# Runs on every push here, and manually: Actions -> Deploy Arcade -> Run workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Add .nojekyll
        run: touch site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
